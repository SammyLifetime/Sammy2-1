name: Update Dependencies
on:
  schedule:
    - cron: '0 4 * * 1'    # every Monday at 04:00 UTC
  workflow_dispatch:      # also allow manual trigger from Actions tab

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Bump all dependencies
        run: ncu -u

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump all dependencies via npm-check-updates"
          git push
        # if there are no changes, the job will simply exit without error
        
